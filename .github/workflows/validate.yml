name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sign.mjs
      - name: fail if signing changed anything (stale sidecar)
        run: git diff --exit-code
      - run: node scripts/validate.mjs catalog.json candidates.json
